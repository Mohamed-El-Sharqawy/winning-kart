services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.http.routers.wk-api.rule: "Host(`${WK_HOST}`) && PathPrefix(`/api`)"
      traefik.http.routers.wk-api.entrypoints: "websecure"
      traefik.http.routers.wk-api.tls.certresolver: "letsencrypt"
      traefik.http.services.wk-api.loadbalancer.server.port: "3000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.wk-dash.rule: "Host(`${WK_HOST}`)"
      traefik.http.routers.wk-dash.entrypoints: "websecure"
      traefik.http.routers.wk-dash.tls.certresolver: "letsencrypt"
      traefik.http.services.wk-dash.loadbalancer.server.port: "80"
